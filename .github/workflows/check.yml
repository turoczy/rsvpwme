name: check

on:
  push:
  pull_request:

jobs:
  skill-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The downloadable zip matches SKILL.md
        run: python3 rsvp-skill/scripts/build_zip.py --check
